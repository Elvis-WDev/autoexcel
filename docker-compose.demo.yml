# El producto entero, para probarlo a mano.
#
#   docker compose -f docker-compose.demo.yml up --build
#   http://localhost:3100
#
# Las credenciales de la base y el secreto de sesion de este archivo son **de
# uso local y solo local**. Estan escritas aqui a la vista, igual que ya lo
# estaban las de `docker-compose.yml`, porque un valor visible que nadie
# confunde con un secreto es mas seguro que uno que parece serio y no lo es.
# Cualquier despliegue real los recibe por entorno.
#
# La clave del motor de inferencia NO esta aqui: se toma de `apps/api/.env`,
# que no entra en el repositorio.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ets-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ets_owner
      POSTGRES_PASSWORD: ets_local_password
      POSTGRES_DB: ets
    volumes:
      - demo-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ets_owner -d ets']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: ets-demo-api
    restart: unless-stopped
    # De aqui sale la clave del motor de inferencia y nada mas: todo lo que
    # depende del despliegue se sobreescribe abajo.
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      LOG_LEVEL: info

      # Los dos roles del ADR 0001. Dentro de la red de compose el servidor se
      # llama `postgres`, no `localhost`.
      DATABASE_URL: postgresql://ets_owner:ets_local_password@postgres:5432/ets?schema=public
      DATABASE_URL_RUNTIME: postgresql://app_runtime:ets_runtime_password@postgres:5432/ets?schema=public

      # El navegador habla siempre con el panel, asi que el origen de confianza
      # es el suyo y no el de la API.
      AUTH_SECRET: solo-para-la-demo-local-cambiar-en-cualquier-despliegue-real
      AUTH_BASE_URL: http://localhost:3100
      AUTH_TRUSTED_ORIGINS: http://localhost:3100

      STORAGE_DIR: /datos/storage

      # La cuenta con la que entrar. Se siembra en el primer arranque.
      SEED_EMAIL: demo@example.com
      SEED_PASSWORD: demo-para-probar-2026
      SEED_NAME: Cuenta de prueba
    volumes:
      - demo-storage:/datos/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:4000/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 24

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # Tiene que ser el nombre del servicio: `localhost` dentro de este
        # contenedor es el propio panel.
        API_ORIGIN: http://api:4000
    container_name: ets-demo-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_ORIGIN: http://api:4000
    ports:
      # Solo desde esta maquina. Este despliegue no esta endurecido para nada
      # que se pueda alcanzar desde fuera.
      - '127.0.0.1:3100:3100'
    depends_on:
      api:
        condition: service_healthy

volumes:
  demo-postgres-data:
  demo-storage:
