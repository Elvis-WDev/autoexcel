services:
  postgres:
    image: postgres:16-alpine
    container_name: ets-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ets_owner
      POSTGRES_PASSWORD: ets_local_password
      POSTGRES_DB: ets
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ets_owner -d ets']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
