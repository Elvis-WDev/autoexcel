packages:
  - 'apps/*'
  - 'packages/*'

# Que dependencias pueden ejecutar scripts de instalacion. pnpm 11 usa esta
# clave; `onlyBuiltDependencies` es de la 10 y aqui se ignora en silencio.
allowBuilds:
  esbuild: true
  prisma: true
  '@prisma/engines': true
  # Opcionales que arrastra better-auth y que no usamos.
  better-sqlite3: false
  msgpackr-extract: false
  workerd: false
  # Los SDK de inferencia: ninguno de los dos declara `install` ni `postinstall`.
  # Lo que pnpm quiere aprobar son scripts de desarrollo del propio paquete
  # —`build`, `prepare`— que no hacen falta para consumirlo desde el registro.
  '@google/genai': false
  protobufjs: false
